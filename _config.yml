title: Loom & Pixel
description: Loom & Pixel is an independent creative studio in Los Angeles — art direction and design, 3D animation and storytelling, VFX and CG production, and commercial and brand content.
url: "https://loomandpixel.com"
permalink: pretty
baseurl: ""

# Projects: one file per project in _projects/, written by sync_projects.py
# (in LoomAndPixel Working Files\Website design files) from Kurt's ArtStation portfolio.
collections:
  projects:
    output: true
    permalink: /work/:name/

# Client reviews live on a private Google Site (Workspace, shared only with invited clients).
# Paste its address here and the /portal/ page shows an "Open client reviews" button.
client_reviews_url: ""

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: projects }
    values: { layout: project }

exclude:
  - README.md
