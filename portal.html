<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Panel // Loom & Pixel</title>
    <base href="/">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <style>
        /* Specific Styles for the Access Interface - Inheriting Studio Variables */
        .portal-wrapper {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 180px 40px 100px 40px; /* Accounts for absolute absolute-position header */
            box-sizing: border-box;
        }

        .portal-panel {
            width: 100%;
            max-width: 480px;
            text-align: left;
        }

        .portal-header {
            margin-bottom: 40px;
        }

        /* Uses your .section-label token variables */
        .portal-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #aeaeb2; /* TIER 3 Text Selection */
            margin-bottom: 12px;
            font-family: monospace;
        }

        /* Uses your body sizes but drops the opacity profile elegantly */
        .portal-desc {
            font-size: 0.95rem; /* Matches your Unified Body Bucket */
            line-height: 1.6;
            color: #aeaeb2;
            margin: 0;
            font-weight: 300;
        }

        .portal-desc span {
            color: #00c8ff; /* Brand Accent Blue */
        }

        /* Merges with your .form-group inputs formatting */
        .portal-input-group {
            position: relative;
            display: flex;
            align-items: center;
            background-color: #1a1a1c; /* Your input fill style token */
            border: 1px solid #2c2c2e; /* Your frame layout lines style token */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .portal-input-group:focus-within {
            border-color: #00c8ff; /* Brand Accent focus match */
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.15); /* Soft hardware neon aura backglow */
        }

        .portal-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 16px;
            font-family: monospace;
            font-size: 0.95rem; /* Form text entry weight scaling match */
            letter-spacing: 0.05em;
            outline: none;
        }

        .portal-input::placeholder {
            color: #636366; /* TIER 4 descriptive indicator color */
        }

        .portal-submit {
            background: transparent;
            border: none;
            color: #aeaeb2;
            font-family: monospace;
            font-size: 0.8rem; /* Matches label bucket text alignment scale */
            letter-spacing: 0.1em;
            cursor: pointer;
            padding: 16px 24px;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .portal-submit:hover {
            color: #00c8ff; /* Turns blue on activation focus loop */
        }

        .error-message {
            font-family: monospace;
            font-size: 0.8rem;
            color: #ff3333;
            letter-spacing: 0.05em;
            margin-top: 16px;
            display: none;
        }

        /* Hidden decrypted system staging viewport layout */
        #secure-viewport {
            display: none;
            width: 100%;
            max-width: 1200px; /* Aligns precisely with your main grid limits */
            margin: 0 auto;
            animation: studioFadeInUp 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

    {% include header.html %}

    <main class="portal-wrapper">
        
        <div id="login-screen" class="portal-panel reveal delay-1">
            <div class="portal-header">
                <div class="portal-title">System // Client Access</div>
                <p class="portal-desc">Enter your authorization verification key to initialize structural pipeline decryption and read active <span>staging modules</span>.</p>
            </div>

            <div class="portal-input-group">
                <input type="password" id="clientKey" class="portal-input" placeholder="ENTER ACCESS KEY..." autocomplete="off">
                <button onclick="decryptPortal()" class="portal-submit">CONNECT ↗</button>
            </div>
            
            <p id="error-msg" class="error-message">✕ INVALID CONFIGURATION KEY PATHWAY</p>
        </div>

        <div id="secure-viewport"></div>

    </main>

    {% include footer.html %}
    
    <script src="/main.js"></script>

    <script>
        // Password is: demo2026
        const encryptedData = "U2FsdGVkX18CRt8KQbr+72q3c7y2NdTQsBlHsDts+0AZSJPykgEPkI2s4Yb9bYd8lTaGtq97cay47GYYYMjoHxyX5hBOx85M2qEJXAE9MTlY4fRJfsG7f1jVoHVKJIEyzvK/D4RVMwSlN0FSy7HjBDoZyK1QqQUHL8S+7utNkcg0V8edE6nK8y0Ta5RATQyb7nFOHNEPuishUdafEhr2ThqyMhpuu9Zm+clgLIzQm44AaebMbwjtXCI99fx6YmIf9kVAlIqxQkuUsyxLzAWTsNQeKXvSRMBGa+4Wu1iofROd5nScerEJvseH5E25P3uz";

        function decryptPortal() {
            const password = document.getElementById('clientKey').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const bytes = CryptoJS.AES.decrypt(encryptedData, password);
                const decryptedHTML = bytes.toString(CryptoJS.enc.Utf8);

                if (decryptedHTML.includes("PIPELINE INITIALIZED")) {
                    document.getElementById('login-screen').style.display = 'none';
                    const viewport = document.getElementById('secure-viewport');
                    viewport.style.display = 'block';
                    viewport.innerHTML = decryptedHTML;
                    errorMsg.style.display = 'none';
                } else {
                    triggerError();
                }
            } catch (e) {
                triggerError();
            }
        }

        function triggerError() {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'block';
            document.getElementById('clientKey').focus();
        }

        document.getElementById('clientKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') decryptPortal();
        });
    </script>
    
</body>
</html>
