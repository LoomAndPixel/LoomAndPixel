<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Panel // Loom & Pixel</title>
    <base href="/">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <style>
        /* Specific Styles for the Access Interface */
        .portal-wrapper {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .portal-panel {
            width: 100%;
            max-width: 440px;
            text-align: left;
        }

        .portal-header {
            margin-bottom: 32px;
        }

        .portal-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #666;
            margin: 0 0 8px 0;
            font-family: monospace;
        }

        .portal-desc {
            font-size: 14px;
            line-height: 1.6;
            color: #999;
            margin: 0;
        }

        .portal-desc span {
            color: #00c8ff; /* Your subtle hint of blue */
            font-weight: bold;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222;
            transition: border-color 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #0055ff; /* Focused blue state */
        }

        .portal-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            padding: 14px 0;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 2px;
            outline: none;
        }

        .portal-input::placeholder {
            color: #444;
        }

        .portal-btn {
            background: transparent;
            border: none;
            color: #666;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 14px 0 14px 16px;
            transition: color 0.2s ease;
        }

        .portal-btn:hover {
            color: #00c8ff; /* Hover blue state */
        }

        .error-message {
            font-family: monospace;
            font-size: 11px;
            color: #ff3333;
            letter-spacing: 1px;
            margin-top: 12px;
            display: none;
        }

        /* The hidden content viewports */
        #secure-viewport {
            display: none;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    {% include header.html %}

    <main class="portal-wrapper">
        
        <div id="login-screen" class="portal-panel">
            <div class="portal-header">
                <h1 class="portal-title">System // Client Access</h1>
                <p class="portal-desc">Enter your unique studio verification key to initialize pipeline decryption and view active <span>staging modules</span>.</p>
            </div>

            <div class="input-group">
                <input type="password" id="clientKey" class="portal-input" placeholder="ENTER ACCESS KEY..." autocomplete="off">
                <button onclick="decryptPortal()" class="portal-btn">CONNECT ↗</button>
            </div>
            
            <p id="error-msg" class="error-message">✕ INVALID VERIFICATION ROUTE</p>
        </div>

        <div id="secure-viewport"></div>

    </main>

    {% include footer.html %}
    
    <script src="/main.js"></script>

    <script>
        // Your scrambled repository string will go right here
        const encryptedData = "TEMPORARY_HOLDER_TEXT"; 

        function decryptPortal() {
            const password = document.getElementById('clientKey').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            try {
                // Execute AES decryption process
                const bytes = CryptoJS.AES.decrypt(encryptedData, password);
                const decryptedHTML = bytes.toString(CryptoJS.enc.Utf8);

                // Check for validation anchor token
                if (decryptedHTML.startsWith("")) {
                    document.getElementById('login-screen').style.display = 'none';
                    const viewport = document.getElementById('secure-viewport');
                    viewport.style.display = 'block';
                    viewport.innerHTML = decryptedHTML;
                } else {
                    triggerError();
                }
            } catch (e) {
                triggerError();
            }
        }

        function triggerError() {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'block';
            // Simple haptic focus shift
            document.getElementById('clientKey').focus();
        }

        // Catch Enter key submission naturally
        document.getElementById('clientKey').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') decryptPortal();
        });
    </script>
    
</body>
</html>
