---
title: Access Panel // Loom & Pixel
description: Client access panel for Loom & Pixel staging previews.
noindex: true
---
<section class="portal wrap">
    <div id="login-screen" class="portal-panel">
        <p class="label">Client access</p>
        <h1 class="page-title">Staging portal</h1>
        <p class="page-lead">Enter your access key to open your staging preview.</p>

        <div class="portal-input-group">
            <label for="clientKey" class="visually-hidden">Access key</label>
            <input type="password" id="clientKey" class="portal-input" placeholder="Access key" autocomplete="off">
            <button type="button" onclick="decryptPortal()" class="button">Open</button>
        </div>

        <p id="error-msg" class="error-message">That key didn't work. Check it and try again.</p>
    </div>

    <div id="secure-viewport"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
        // Secure abstract container payload matching password key
        const encryptedData = "U2FsdGVkX19fIKHBlJTJlhJT2TvBfUOWnet5V7EWM64BUqIcgdkmrQCdzhiS+bYGq0vshUl668HokqcoC1smmsiEOKG4o/pzYUtiGOFLr/oCot9kSVrXqyb+WRlhXrLil93tKXR0Zq6aI3mKo9KDHpF60UbThHBpUMaDL8dCNKqtRHVxT44cMy/d9/lyS3hH3sJnsIX+XjNYDCXI6Vj6jVRBZiKklwSeqpCg2eGzG6S8iyq3SgJnIRnUn5i9/lrh5/sBnMmn3U3ifdpm1ERj2ln9WWqwYYfseGcUQE8/e7g6kpbmP0B3gW6LQlF7dghdtU9JgcXDeUvzOwMzh4TBeqKRMG9VDC9jJCsY+dBm6WY=";

        function decryptPortal() {
            const password = document.getElementById('clientKey').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const bytes = CryptoJS.AES.decrypt(encryptedData, password);
                const decryptedHTML = bytes.toString(CryptoJS.enc.Utf8);

                // Validation marker to handle DOM injection safely
                if (decryptedHTML.includes("iframe")) {
                    document.getElementById('login-screen').style.display = 'none';
                    const viewport = document.getElementById('secure-viewport');
                    viewport.style.display = 'block';
                    viewport.innerHTML = decryptedHTML;
                    errorMsg.style.display = 'none';
                } else {
                    triggerError();
                }
            } catch (e) {
                triggerError();
            }
        }

        function triggerError() {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'block';
            document.getElementById('clientKey').focus();
        }

        document.getElementById('clientKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') decryptPortal();
        });
    </script>
