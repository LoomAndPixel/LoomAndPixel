<section class="section wrap contact" id="contact">
    <div class="contact-info">
        <p class="label">05 · Contact</p>
        <h2 class="contact-title">Building something bold?</h2>
        <p class="contact-lead">Have a project in mind, or want to discuss a collaboration? Reach out, and let's build something compelling.</p>
        <a href="mailto:Hello@LoomAndPixel.com?subject=Inquiry" class="contact-email">Hello@LoomAndPixel.com</a>
    </div>
    <div class="form-wrapper">
        <form class="contact-form" id="pixelForm" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="6da7bdc9-c9f9-49ac-b948-e08bd97aaffc">
            <input type="hidden" name="subject" value="New Website Inquiry — Loom & Pixel">
            <input type="checkbox" name="botcheck" class="visually-hidden" tabindex="-1" autocomplete="off">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your name" autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@company.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Tell us about your project"></textarea>
            </div>
            <button type="submit" id="submitBtn" class="button">Send message</button>
        </form>
        <div id="formResponse" class="form-response" hidden>
            <h3>Thank you!</h3>
            <p>Your message has been received. We'll review your inquiry and get back to you soon.</p>
        </div>
    </div>
</section>
