<section class="contact-section" id="contact">
    <div class="section-header reveal">
        <span class="section-label">Connect</span>
        <h2 class="section-title">Inquiries</h2>
    </div>

    <div class="contact-layout">
        <div class="contact-info reveal delay-1">
            <p>Have a project in mind, or want to discuss a collaboration? Reach out, and let's build something compelling.</p>
            <a href="mailto:Hello@LoomAndPixel.com?subject=Inquiry" class="direct-email">Hello@LoomAndPixel.com</a>
        </div>

        <div class="form-wrapper reveal delay-2">
            <form class="contact-form" id="pixelForm" action="https://api.web3forms.com/submit" method="POST">
                
                <input type="hidden" name="access_key" value="6da7bdc9-c9f9-49ac-b948-e08bd97aaffc">
                <input type="hidden" name="subject" value="New Website Inquiry — Loom & Pixel">
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="hello@domain.com">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="Tell us about your project..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Send Message</button>
            </form>

            <div id="formResponse" style="display: none; padding: 40px 0; max-width: 400px;">
                <h3 style="color: #ffffff; font-size: 1.5rem; margin-bottom: 12px;">Thank you!</h3>
                <p style="color: #aeaeb2; font-size: 1.1rem; line-height: 1.6;">Your message has been received. We'll review your inquiry and get back to you soon.</p>
            </div>
        </div>
    </div>
</section>
