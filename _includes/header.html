<header class="site-header">
    <a href="/" class="header-mark" aria-label="Loom & Pixel home">
        {% include brand/amp.svg %}
    </a>
    <button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="siteNav">
        <span class="menu-toggle-lines" aria-hidden="true"></span>
        <span class="menu-toggle-text">Menu</span>
    </button>
    <nav class="site-nav" id="siteNav" aria-label="Main">
        {% assign here = page.url %}
        <a href="/#work"{% if here contains '/work/' %} aria-current="page"{% endif %}>Work</a>
        <a href="/studio/"{% if here == '/studio/' %} aria-current="page"{% endif %}>Studio</a>
        <a href="/collaborate/"{% if here == '/collaborate/' %} aria-current="page"{% endif %}>Collaborate</a>
        <a href="/contact/"{% if here == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
</header>
