<section class="clients-section">
    <div class="section-header reveal">
        <span class="section-label">02 // TRUSTED BY</span>
        <h2 class="section-title">Brand Clients</h2>
    </div>

    <div class="clients-grid reveal delay-1" style="--columns: 6;">
        {% for client in site.data.clients %}
        <div class="client-logo">
            <img src="assets/logos/{{ client.logo }}" alt="{{ client.alt }}">
        </div>
        {% endfor %}
    </div>
</section>
