<section class="section wrap" id="clients">
    <div class="section-head">
        <div>
            <p class="label">03 · Trusted by</p>
            <h2 class="section-title">Clients</h2>
        </div>
    </div>
    <!-- Logos rest in one soft monochrome tone and show their real colours on hover -->
    <div class="clients-grid">
        {% for client in site.data.clients %}
        <div class="client-logo">
            <img src="/assets/logos/{{ client.logo }}" alt="{{ client.alt }}" loading="lazy">
        </div>
        {% endfor %}
    </div>
</section>
